<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEREH</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <video id="intro" autoplay muted playsinline></video>
    <script>
      const params = new URLSearchParams(window.location.search);
      const videoSrc = params.get("video") || "./assets/intro.mp4";
      const video = document.getElementById("intro");
      video.src = videoSrc;
      video.load();
    </script>
  </body>
</html>
